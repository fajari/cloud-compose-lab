services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://cloudusers:${DB_PASSWORD}@db:5432/cloudlab
    depends_on:
      db:
         condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cloudlab
      POSTGRES_USER: clouduser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clouduser -d cloudlab"]
      interval: 5s
      retries: 10

volumes:
  postgres_data:
